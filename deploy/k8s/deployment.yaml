# ==============================================================================
# SEO OS AI Workbench — Enterprise Kubernetes Deployment Template
# NOTE: Interface template for customer-controlled infrastructure.
# For multi-replica HA, configure an external managed PostgreSQL database and
# Redis worker queue before scaling replicas > 1.
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seo-os-workbench
  labels:
    app: seo-os-workbench
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seo-os-workbench
  template:
    metadata:
      labels:
        app: seo-os-workbench
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: app
          image: ghcr.io/your-org/seo-os-workbench:latest
          ports:
            - containerPort: 4000
          envFrom:
            - secretRef:
                name: seo-os-workbench-secrets
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: seo-os-workbench
spec:
  selector:
    app: seo-os-workbench
  ports:
    - port: 80
      targetPort: 4000
